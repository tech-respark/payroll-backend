spring.application.name=payroll-management
server.port=8092

spring.datasource.url=jdbc:mysql://localhost:3306/payroll_management?autoReconnect=true&useSSL=false&createDatabaseIfNotExist=true&characterEncoding=utf8&useUnicode=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:innobliss123$}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.tomcat.max-parameter-count=1000

server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB

security.require-ssl=true
server.ssl.enabled=true
server.ssl.key-store-password=innobliss123$
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-type=JKS
server.ssl.key-alias=respark.gorespark.in
trust-store=classpath:keystore.jks
trust-store-password=innobliss123$


#prometheus
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Fix Hibernate 6 breaking change with Instant & Timezones (revert to Hibernate 5 behavior)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

# RabbitMQ
spring.rabbitmq.host=43.204.147.165
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin1234
#Environment
env=mylocal
address.queue=dev.addr

logging.file.name=logs/payroll-service.log
