spring.application.name=payroll-management
server.port=8092

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payroll_management?autoReconnect=true&useSSL=false&createDatabaseIfNotExist=true&characterEncoding=utf8&useUnicode=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

server.tomcat.max-parameter-count=1000
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB

security.require-ssl=true
server.ssl.enabled=true
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-type=JKS
server.ssl.key-alias=${SSL_KEY_ALIAS:respark.gorespark.in}
trust-store=classpath:keystore.jks
trust-store-password=${SSL_TRUST_STORE_PASSWORD:}

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5174,http://localhost:5174}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=false
management.health.mail.enabled=false

spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
env=${APP_ENV:local}
address.queue=${ADDRESS_QUEUE:dev.addr}

logging.file.name=logs/payroll-service.log

spring.mail.port=${MAIL_PORT:587}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
